# GitHub Branch Protection Configuration
# Used with probot/settings app or manual configuration
# Defines branch protection rules for main and develop branches

# Repository settings
repository:
  # Repository name (if different from GitHub repo name)
  name: final-golf-saas

  # Repository description
  description: "Golf Booking SaaS Platform - A comprehensive B2B SaaS platform for golf courses with booking management, POS, and marketplace features"

  # Repository homepage
  homepage: https://finalgolf.com

  # Repository topics
  topics:
    - golf
    - booking
    - saas
    - nextjs
    - typescript
    - prisma
    - monorepo
    - pnpm-workspace

  # Default branch
  default_branch: main

  # Repository features
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: false

  # Security settings
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  allow_auto_merge: true

# Branch protection rules
branches:
  # Main branch protection (production)
  - name: main
    protection:
      # Require status checks to pass before merging
      required_status_checks:
        # Require branches to be up to date before merging
        strict: true
        # Required status checks
        contexts:
          - "CI Pipeline / Validate Workspace"
          - "CI Pipeline / Lint & Format Check"
          - "CI Pipeline / Type Check"
          - "CI Pipeline / Run Tests (unit)"
          - "CI Pipeline / Build Validation (packages)"
          - "CI Pipeline / Build Validation (apps)"
          - "CI Pipeline / Security Audit"
          - "CI Pipeline / CI Summary"

      # Require pull request reviews before merging
      required_pull_request_reviews:
        # Number of required approving reviews
        required_approving_review_count: 2
        # Dismiss stale reviews when new commits are pushed
        dismiss_stale_reviews: true
        # Require review from code owners
        require_code_owner_reviews: true
        # Allow specific users to dismiss reviews
        dismissal_restrictions:
          users: []
          teams: []
        # Require review from someone other than the person who opened the PR
        require_last_push_approval: true

      # Enforce restrictions for administrators
      enforce_admins: false

      # Restrict pushes to specific users/teams
      restrictions:
        users: []
        teams: []
        apps: []

      # Require linear history (no merge commits)
      required_linear_history: true

      # Prohibit force pushes
      allow_force_pushes: false

      # Prohibit deletions
      allow_deletions: false

      # Block creations (prevent direct commits)
      block_creations: false

      # Required conversation resolution
      required_conversation_resolution: true

      # Lock branch (prevent any pushes)
      lock_branch: false

  # Develop branch protection (staging)
  - name: develop
    protection:
      # Require status checks to pass before merging
      required_status_checks:
        # Require branches to be up to date before merging
        strict: true
        # Required status checks (same as main but more lenient)
        contexts:
          - "CI Pipeline / Validate Workspace"
          - "CI Pipeline / Lint & Format Check"
          - "CI Pipeline / Type Check"
          - "CI Pipeline / Run Tests (unit)"
          - "CI Pipeline / Build Validation (packages)"
          - "CI Pipeline / Build Validation (apps)"
          - "CI Pipeline / CI Summary"

      # Require pull request reviews before merging
      required_pull_request_reviews:
        # Number of required approving reviews
        required_approving_review_count: 1
        # Dismiss stale reviews when new commits are pushed
        dismiss_stale_reviews: true
        # Require review from code owners for sensitive files
        require_code_owner_reviews: true
        # Allow specific users to dismiss reviews
        dismissal_restrictions:
          users: []
          teams: []
        # Don't require review from someone other than PR author (more flexible for develop)
        require_last_push_approval: false

      # Don't enforce restrictions for administrators (allow admin override in develop)
      enforce_admins: false

      # No push restrictions for develop branch
      restrictions:
        users: []
        teams: []
        apps: []

      # Don't require linear history in develop (allow merge commits)
      required_linear_history: false

      # Prohibit force pushes
      allow_force_pushes: false

      # Prohibit deletions
      allow_deletions: false

      # Allow branch creation
      block_creations: false

      # Required conversation resolution
      required_conversation_resolution: true

      # Don't lock develop branch
      lock_branch: false

  # Release branch protection pattern
  - name: "release/*"
    protection:
      # Require status checks to pass before merging
      required_status_checks:
        strict: true
        contexts:
          - "CI Pipeline / CI Summary"

      # Require pull request reviews
      required_pull_request_reviews:
        required_approving_review_count: 2
        dismiss_stale_reviews: true
        require_code_owner_reviews: true

      # Enforce for admins
      enforce_admins: true

      # Require linear history
      required_linear_history: true

      # Prohibit force pushes and deletions
      allow_force_pushes: false
      allow_deletions: false

  # Hotfix branch protection pattern
  - name: "hotfix/*"
    protection:
      # Require essential status checks only (for emergency fixes)
      required_status_checks:
        strict: false # Allow emergency merges
        contexts:
          - "CI Pipeline / Validate Workspace"
          - "CI Pipeline / Lint & Format Check"
          - "CI Pipeline / Type Check"

      # Require pull request reviews but allow emergency override
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: false # Keep reviews during hotfixes
        require_code_owner_reviews: true

      # Don't enforce for admins (allow emergency override)
      enforce_admins: false

      # Allow force pushes for emergency situations
      allow_force_pushes: true
      allow_deletions: false

