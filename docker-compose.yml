services:
  # PostgreSQL 15 Database
  postgres:
    image: postgres:15-alpine
    container_name: gbs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: final_golf_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - final-golf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d final_golf_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # Redis for Caching and Sessions
  redis:
    image: redis:7-alpine
    container_name: gbs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - final-golf-network
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # MinIO for S3-compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: gbs-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DOMAIN: localhost
      MINIO_SERVER_URL: http://localhost:9000
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./docker/minio/policies:/policies
    networks:
      - final-golf-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # Mailpit for Email Testing (ARM64 compatible alternative to Mailhog)
  mailpit:
    image: axllent/mailpit:latest
    container_name: gbs-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - final-golf-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Adminer for Database Administration (optional)
  adminer:
    image: adminer:latest
    container_name: gbs-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - final-golf-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # RedisInsight for Redis Administration (ARM64 compatible)
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: gbs-redis-insight
    restart: unless-stopped
    ports:
      - "8081:8001"
    volumes:
      - redis_insight_data:/db
    networks:
      - final-golf-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
    name: final-golf-postgres-data
  redis_data:
    driver: local
    name: final-golf-redis-data
  minio_data:
    driver: local
    name: final-golf-minio-data
  redis_insight_data:
    driver: local
    name: final-golf-redis-insight-data

networks:
  final-golf-network:
    driver: bridge
    name: final-golf-network
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1